# Inference with the June-2026 ResNet-152 electron VERTEX POSITION model.
#
# HOW TO USE
#   1. copy this file into the `config/` directory of your WatChMaL checkout
#      (branch hkfd_jun26 of https://github.com/nickwp/WatChMaL)
#   2. edit the two lines marked "EDIT ME" below to point at YOUR data
#   3. check the composed config without running anything:
#        python main.py --config-name=hkfd_jun26_hx2_regression_e_pos_infer -c job
#   4. run it:
#        python main.py --config-name=hkfd_jun26_hx2_regression_e_pos_infer
#
# See /sps/hyperk/common/resnet_hkfd_jun26_modelcards/INFERENCE.md for the full explanation.

defaults:
  - model: resnet152_hkfd            # ResNet-152, 5 input channels, HK far detector
  - engine: regression               # regression engine (predicts numbers, not classes)
  - tasks/restore_state: restore_state   # <- load the trained weights ...
  - tasks/evaluate: test_hkfd            # <- ... then run over the test set. ORDER MATTERS.
  - data: hkfd_dec2025_hx2_e_fc
  - _self_                           # everything below overrides the groups above

# ---------------------------------------------------------------- what to predict
engine:
  target_key:
    - positions
model:
  num_output_channels: 3             # (x, y, z) in cm

# ---------------------------------------------------------------- run settings
amp: false                           # the model was trained in full fp32; keep it that way
gpu_list: [0]                        # one GPU. [] = CPU (very slow). [0,1,2,3] = 4 GPUs (DDP)
seed: 1234                           # irrelevant for a sequential test pass, but pin it anyway
dump_path: './outputs/'              # .npy outputs land here, inside the hydra run directory

# ---------------------------------------------------------------- the tasks, in order
tasks:
  restore_state:
    weight_file: /sps/hyperk/common/resnet_hkfd_jun26_modelcards/e_pos/RegressionEngine_ResNet_BEST.pth
  evaluate:
    report_interval: 10              # print progress every 10 batches
    loss:                            # the loss used at training time, for a comparable number
      _target_: torch.nn.HuberLoss
      delta: 20
    data_loaders:
      test:
        batch_size: 1024
        num_workers: 4

# ---------------------------------------------------------------- your data
data:
  # npz with a `test_idxs` array = the indices of the events to run on.
  split_path: /PATH/TO/YOUR/split_indices.npz     # <<<<<< EDIT ME
  dataset:
    h5file: /PATH/TO/YOUR/events.h5               # <<<<<< EDIT ME
    # These two come with the models - do not substitute another geometry.
    geometry_file: /sps/hyperk/common/resnet_hkfd_jun26_modelcards/geometry/HK_HybridmPMT_WithOD_Realistic_geo_dump.npz
    pmt_positions_file: /sps/hyperk/common/resnet_hkfd_jun26_modelcards/geometry/HK_HybridmPMT_WithOD_Realistic_mapping_squashed.npz
    one_indexed: True # In input files from Mathias, PMT IDs begin from 1. 
    
hydra:
  run:
    dir: ./outputs/${hydra.job.config_name}/${now:%Y-%m-%d}_${now:%H-%M-%S.%f}
  job:
    chdir: True
